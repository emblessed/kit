<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи | Admin Panel</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        /* Дополнительные стили для баджей ролей */
        .badge.admin { background: #e0e7ff; color: #4338ca; }
        .badge.student { background: #dcfce7; color: #15803d; }
        .badge.partner { background: #fef9c3; color: #a16207; }
        .page-btn { cursor: pointer; }
        .page-btn.active { background: #6366f1; color: white; border-color: #6366f1; }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>PractDay <span>AI</span></h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">📊 Дашборд</a>
                <a href="users.html" class="active">👥 Пользователи</a>
                <a href="practices.html">🏢 Практики</a>
                <a href="reports.html">📈 Отчеты</a>
                
                <div class="sidebar-system">
                    <p class="system-title">СИСТЕМА</p>
                    <a href="#" class="system-link">Настройки</a>
                    <a href="#" onclick="auth.logout()" class="system-link logout">Выход</a>
                </div>
            </nav>
        </aside>

        <main class="content-area">
            <header class="content-header">
                <div>
                    <h1>Управление пользователями</h1>
                    <p>Просмотр, редактирование и контроль доступа</p>
                </div>
                <button class="btn-primary btn-md" onclick="location.href='user-form.html'">
                    + Добавить пользователя
                </button>
            </header>

            <div class="card">
                <div class="filter-bar">
                    <div class="filter-group flex-1">
                        <label class="label-caps">ПОИСК</label>
                        <input type="text" id="searchInput" placeholder="Имя, Email или ID..." class="form-control">
                    </div>
                    <div class="filter-group w-200">
                        <label class="label-caps">РОЛЬ</label>
                        <select id="roleFilter" class="form-control">
                            <option value="">Все роли</option>
                            <option value="student">Студенты</option>
                            <option value="partner">Партнеры</option>
                            <option value="admin">Админы</option>
                        </select>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Пользователь</th>
                                <th>Роль</th>
                                <th>Регистрация</th>
                                <th>Статус</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            </tbody>
                    </table>
                </div>
                
                <div class="pagination-area">
                    <span id="paginationInfo" class="text-sm text-light">Загрузка данных...</span>
                    <div id="paginationButtons" class="pagination-buttons">
                        </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>

<script>
let currentPage = 1;
const limit = 5;

async function loadUsers(page = 1) {
    currentPage = page;
    
    // Получаем актуальные значения фильтров
    const roleSelect = document.getElementById('roleFilter');
    const searchInput = document.getElementById('searchInput');
    
    const role = roleSelect ? roleSelect.value : "";
    const search = searchInput ? searchInput.value : "";
    
    try {
        // Формируем URL вручную, чтобы избежать дублирования параметров
        let url = `http://localhost:3000/api/admin/users?page=${page}&limit=${limit}`;
        
        if (role) {
            url += `&role=${encodeURIComponent(role)}`;
        }
        if (search) {
            url += `&search=${encodeURIComponent(search)}`;
        }

        console.log("Отправка запроса на:", url); // Проверьте это в консоли браузера

        const response = await fetch(url, {
            headers: {
                'Authorization': `Bearer ${localStorage.getItem('practday_token')}`
            }
        });
        
        if (!response.ok) throw new Error('Ошибка сервера');
        
        const data = await response.json();

        renderTable(data.users);
        renderPagination(data.totalPages, data.currentPage, data.total);
        
    } catch (error) {
        console.error("Критическая ошибка загрузки:", error);
        document.getElementById('usersTableBody').innerHTML = 
            '<tr><td colspan="5" style="text-align:center; color:red;">Ошибка связи с сервером</td></tr>';
    }
}

function renderTable(users) {
    const tbody = document.getElementById('usersTableBody');
    if (!users || users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">Никто не найден</td></tr>';
        return;
    }

    tbody.innerHTML = users.map(user => `
        <tr>
            <td class="user-info">
                <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(user.email)}&background=6366f1&color=fff" class="avatar">
                <div>
                    <div class="font-bold">${user.email}</div>
                    <div class="text-xs text-light">ID: ${user._id}</div>
                </div>
            </td>
            <td><span class="badge ${user.role}">${user.role}</span></td>
            <td>${user._id ? new Date(parseInt(user._id.substring(0, 8), 16) * 1000).toLocaleDateString() : '—'}</td>
            <td><span class="status-indicator online">Активен</span></td>
            <td>
                <button class="btn-outline btn-xs" onclick="editUser('${user._id}')">⚙️</button>
            </td>
        </tr>
    `).join('');
}

function renderPagination(totalPages, current, totalCount) {
    const buttonsContainer = document.getElementById('paginationButtons');
    const info = document.getElementById('paginationInfo');
    
    info.innerText = `Всего: ${totalCount}`;

    let btnsHtml = '';
    for (let i = 1; i <= totalPages; i++) {
        btnsHtml += `
            <button class="page-btn ${i === current ? 'active' : ''}" 
                    onclick="loadUsers(${i})">${i}</button>
        `;
    }
    buttonsContainer.innerHTML = btnsHtml;
}

// Инициализация событий
document.addEventListener('DOMContentLoaded', () => {
    const roleFilter = document.getElementById('roleFilter');
    const searchInput = document.getElementById('searchInput');

    // Важно: вешаем событие напрямую
    if (roleFilter) {
        roleFilter.addEventListener('change', () => {
            console.log("Смена роли на:", roleFilter.value);
            loadUsers(1); 
        });
    }

    if (searchInput) {
        searchInput.addEventListener('input', () => {
            clearTimeout(window.searchTimer);
            window.searchTimer = setTimeout(() => loadUsers(1), 500);
        });
    }

    loadUsers(1);
});
</script>
</body>
</html>
