<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление доступа | PractDayAI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forgot-password.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body class="forgot-page">

    <div class="forgot-container">
        <header class="forgot-header">
            <div class="forgot-icon">🔑</div>
            <h1>Забыли пароль?</h1>
            <p>Введите ваш email, и мы отправим вам инструкции по сбросу.</p>
        </header>

        <div class="card forgot-card">
            
            <form id="forgotForm" onsubmit="event.preventDefault(); showSuccess();">
                <div class="input-group">
                    <label for="email">ВАШ EMAIL</label>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>
                
                <button type="submit" class="btn-primary">ОТПРАВИТЬ ССЫЛКУ</button>
                
                <div class="back-link">
                    <a href="login.html">Вспомнили пароль? Войти</a>
                </div>
            </form>

            <div id="successMessage" class="success-message">
                <div class="success-icon">📧</div>
                <h3>Проверьте почту!</h3>
                <p>Мы отправили ссылку для сброса пароля на ваш адрес. Она будет действительна в течение 30 минут.</p>
                <button class="btn-secondary" onclick="location.reload()">ОТПРАВИТЬ ПОВТОРНО</button>
            </div>
            
        </div>

        <footer class="forgot-support">
            <p>Нужна помощь? Обратитесь в <a href="#">поддержку</a></p>
        </footer>
    </div>

    <script>
        function showSuccess() {
            // Используем классы вместо жесткого переключения стилей
            document.getElementById('forgotForm').classList.add('hidden');
            document.getElementById('successMessage').classList.add('visible');
        }
    </script>
</body>
</html>
