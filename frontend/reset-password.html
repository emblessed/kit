<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Сброс пароля - PractDay AI</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/reset-password.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body class="reset-page">

    <div class="reset-container">
        
        <div class="card reset-card">
            <div class="back-link-wrapper">
                <a href="/login.html" class="back-link">← Назад к входу</a>
            </div>
            
            <header class="reset-header">
                <h1>PractDay <span>AI</span></h1>
                <h2>Сброс пароля</h2>
            </header>
            
            <form id="resetForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required readonly>
                </div>
                
                <div class="input-group">
                    <label for="password">Новый пароль</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                    <small class="password-requirements">Минимум 8 символов, заглавная буква и цифра</small>
                </div>
                
                <div class="input-group">
                    <label for="password_confirmation">Подтверждение пароля</label>
                    <input type="password" id="password_confirmation" name="password_confirmation" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn-primary">Сбросить пароль</button>
            </form>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    
    <script>
        // Получение email из URL
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        
        const emailInput = document.getElementById('email');
        if (email) {
            emailInput.value = decodeURIComponent(email);
        } else {
            emailInput.placeholder = 'Введите ваш email';
            emailInput.readOnly = false;
        }
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const emailValue = emailInput.value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirmation').value;
            
            if (!emailValue) {
                auth.showMessage('Введите email', 'error');
                return;
            }
            
            if (password !== passwordConfirm) {
                auth.showMessage('Пароли не совпадают', 'error');
                return;
            }
            
            if (password.length < 8) {
                auth.showMessage('Пароль должен быть минимум 8 символов', 'error');
                return;
            }
            
            if (!/[A-Z]/.test(password)) {
                auth.showMessage('Пароль должен содержать заглавную букву', 'error');
                return;
            }
            
            if (!/[0-9]/.test(password)) {
                auth.showMessage('Пароль должен содержать цифру', 'error');
                return;
            }
            
            // Демо-режим
            auth.showMessage('✅ Пароль успешно изменён!', 'success');
            setTimeout(() => {
                window.location.href = '/login.html';
            }, 2000);
        });
    </script>
</body>
</html>
